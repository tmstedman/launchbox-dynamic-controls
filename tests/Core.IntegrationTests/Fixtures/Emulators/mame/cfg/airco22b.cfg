<?xml version="1.0"?>
<!-- Air Combat 22's throttle: read from an analogue axis AND nudged by the two triggers,
     which are a different physical control. The artwork labels all three separately. -->
<mameconfig version="10">
    <system name="airco22b">
        <input>
            <port tag=":ADC.2" type="P1_AD_STICK_Z" mask="1023" defvalue="512">
                <newseq type="standard">JOYCODE_1_RZAXIS</newseq>
                <newseq type="increment">JOYCODE_1_SLIDER1_NEG_SWITCH</newseq>
                <newseq type="decrement">JOYCODE_1_SLIDER2_NEG_SWITCH</newseq>
            </port>
            <port tag=":MCUP5A" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">JOYCODE_1_BUTTON1</newseq>
            </port>
        </input>
    </system>
</mameconfig>
